name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]  # Se déclenche quand vous poussez sur main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3  # Remplacez par votre région

      - name: Create deployment package
        run: |
          zip -r deploy.zip . -x "*.git*" ".github/*"
          echo "Package created: deploy.zip"

      - name: Deploy to EC2 via CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name soccernet-tracker-app \
            --deployment-group-name soccernet-deployment-group \
            --s3-location bucket=soccernet-deploy-bucket,key=deploy.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE